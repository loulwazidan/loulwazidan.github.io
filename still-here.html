<h1 style="margin: 0; font-weight: 500; font-size: 30px; line-height: 1.1; letter-spacing: 0.01em; text-transform: uppercase">Still Here</h1>
<span style="font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: #1E1C1A">Thesis — 2026<span style="letter-spacing: 0.48px"> —&nbsp;AUGMENTED REALITY BOOK</span></span>
<p style="margin: 0; font-size: 17px; line-height: 1.5; font-weight: 500">Still Here is an exploration of the afterlife of relationships.</p>
<p style="margin: 0; font-size: 14px; line-height: 1.6">It begins with the idea that when something ends, it doesn’t disappear. It transforms. The people we lose, the places we leave, and the versions of ourselves we outgrow stay with us. They live in the habits we keep, the things we can’t look at the same way, and the words we say in someone else’s voice without even noticing.</p>
<p style="margin: 0; font-size: 14px; line-height: 1.6; font-weight: 500">Absence is rarely talked about as something that stays.</p>
<p style="margin: 0; font-size: 14px; line-height: 1.6">It is something everyone experiences, but rarely speaks about directly. Not as an ongoing condition. Not as something that continues to exist alongside us.</p>
<p style="margin: 0; font-size: 14px; line-height: 1.6">This project started with a personal observation: the people and things we lose don’t actually leave.</p>
<p style="margin: 0; font-size: 14px; line-height: 1.6">I wanted to make that visible. Not through grief, but through recognition. To explore the brighter side of absence and the idea that losing someone doesn’t mean they simply disappear. There is comfort in knowing that parts of them remain, quietly shaping the person you become.</p>
</section>
