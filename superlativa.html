<script>window.__DC_PAGE = {"desktop": {"js": "\nconst H = window.__DC_H;\nconst L = 64, R = 736, HW = 640;\nconst E_TOP = 400, E_H = 736;\nconst J_H = 424, J1 = E_TOP + E_H + 48, J2 = J1 + J_H + 32;\nconst B_H = 229, B1 = J2 + J_H + 64, B2 = B1 + B_H + 32;\nconst ITEMS = [\n  { img: '550eafa1f8703b3285e6c4e36188b20b.jpg', alt: 'Superlativa embossed brand marks on deep red', x: L, top: E_TOP, w: 1312, h: E_H, fit: 'cover' },\n  { img: '4ed891a7b5193f7d2c6ddbcbe3357182.jpg', alt: 'Superlativa Digest On supplement jar', x: L, top: J1, w: HW, h: J_H, fit: 'cover' },\n  { img: '240126c7c7ff8ee4f77d67b23740da2d.jpg', alt: 'Superlativa Aphrodite supplement jar', x: R, top: J1, w: HW, h: J_H, fit: 'cover' },\n  { img: 'cd11bea2bf7efc88c0dad7c4f3621a3c.jpg', alt: 'Superlativa Muse supplement jar', x: L, top: J2, w: HW, h: J_H, fit: 'cover' },\n  { img: '4de32eba531234e80e35fb21f74a626e.jpg', alt: 'Superlativa Electra supplement jar', x: R, top: J2, w: HW, h: J_H, fit: 'cover' },\n  { img: '3c58a80e287e0afa8346dd2ef097014f.png', alt: 'Superlativa Electra label, front and back', x: L, top: B1, w: HW, h: B_H, fit: 'contain' },\n  { img: 'ed5f9a54064d3997fc22d98241ca7c13.png', alt: 'Superlativa Aphrodite label, front and back', x: R, top: B1, w: HW, h: B_H, fit: 'contain' },\n  { img: '70e2aef34b51a2e5770afb9834e58519.png', alt: 'Superlativa Muse label, front and back', x: L, top: B2, w: HW, h: B_H, fit: 'contain' },\n  { img: '338f17a87a6f4ef8275545ae8abd5532.png', alt: 'Superlativa Digest On label, front and back', x: R, top: B2, w: HW, h: B_H, fit: 'contain' }\n];\nconst END_TOP = B2 + B_H + 120;\nconst CONTENT_H = END_TOP + 200;\nconst MAX_P = Math.max(0, CONTENT_H - H);\nclass Component extends DCLogic {\n  componentDidMount() {\n    this.p = 0;\n    this.t = 0;\n    this.rev = {};\n    const tick = () => {\n      const d = this.t - this.p;\n      let changed = false;\n      if (Math.abs(d) > 0.2) { this.p += d * 0.1; changed = true; }\n      ITEMS.forEach((it, i) => {\n        if (!this.rev[i] && this.p >= Math.max(50 + i * 90, it.top - (H - 120))) { this.rev[i] = true; changed = true; }\n      });\n      if (changed) this.setState({ p: this.p, n: Object.keys(this.rev).length });\n      this.raf = requestAnimationFrame(tick);\n    };\n    this.raf = requestAnimationFrame(tick);\n  }\n  componentWillUnmount() {\n    cancelAnimationFrame(this.raf);\n  }\n  renderVals() {\n    const p = (this.state && this.state.p != null) ? this.state.p : 0;\n    const rev = this.rev || {};\n    return {\n      accent: this.props.accent ?? '#B3202A',\n      bg: this.props.bg ?? '#F4F2ED',\n      contentH: CONTENT_H,\n      endTop: END_TOP,\n      scrollY: Math.round(-p * 10) / 10,\n      hintOp: p > 40 ? 0 : 1,\n      onWheel: (e) => { this.t = Math.min(MAX_P, Math.max(0, (this.t ?? 0) + e.deltaY * 0.9)); },\n      items: ITEMS.map((it, i) => ({\n        ...it,\n        op: rev[i] ? 1 : 0,\n        dy: rev[i] ? 0 : 70,\n        s: rev[i] ? 1 : 0.86\n      }))\n    };\n  }\n}\n", "props": {"accent": "#B3202A", "bg": "#F4F2ED"}, "w": 1440, "tpl": "tpl-desktop"}, "mobile": {"js": "\nconst H = window.__DC_H;\nconst SRC = [\n  ['550eafa1f8703b3285e6c4e36188b20b.jpg', 'Superlativa embossed brand marks on deep red', 192, 'cover'],\n  ['4ed891a7b5193f7d2c6ddbcbe3357182.jpg', 'Superlativa Digest On supplement jar', 227, 'cover'],\n  ['240126c7c7ff8ee4f77d67b23740da2d.jpg', 'Superlativa Aphrodite supplement jar', 227, 'cover'],\n  ['cd11bea2bf7efc88c0dad7c4f3621a3c.jpg', 'Superlativa Muse supplement jar', 227, 'cover'],\n  ['4de32eba531234e80e35fb21f74a626e.jpg', 'Superlativa Electra supplement jar', 227, 'cover'],\n  ['3c58a80e287e0afa8346dd2ef097014f.png', 'Superlativa Electra label, front and back', 123, 'contain'],\n  ['ed5f9a54064d3997fc22d98241ca7c13.png', 'Superlativa Aphrodite label, front and back', 123, 'contain'],\n  ['70e2aef34b51a2e5770afb9834e58519.png', 'Superlativa Muse label, front and back', 123, 'contain'],\n  ['338f17a87a6f4ef8275545ae8abd5532.png', 'Superlativa Digest On label, front and back', 123, 'contain']\n];\nconst R0 = 420, GAP = 20;\nlet _y = R0;\nconst ITEMS = SRC.map((s) => { const it = { img: s[0], alt: s[1], h: s[2], fit: s[3], top: _y }; _y += s[2] + GAP; return it; });\nconst END_TOP = _y + 60;\nconst CONTENT_H = END_TOP + 170;\nconst MAX_P = Math.max(0, CONTENT_H - H);\nclass Component extends DCLogic {\n  componentDidMount() {\n    this.p = 0;\n    this.t = 0;\n    this.rev = {};\n    const tick = () => {\n      const d = this.t - this.p;\n      let changed = false;\n      if (Math.abs(d) > 0.2) { this.p += d * 0.1; changed = true; }\n      ITEMS.forEach((it, i) => {\n        if (!this.rev[i] && this.p >= Math.max(50 + i * 110, it.top - (H - 90))) { this.rev[i] = true; changed = true; }\n      });\n      if (changed) this.setState({ p: this.p, n: Object.keys(this.rev).length });\n      this.raf = requestAnimationFrame(tick);\n    };\n    this.raf = requestAnimationFrame(tick);\n  }\n  componentWillUnmount() {\n    cancelAnimationFrame(this.raf);\n  }\n  move(dy) {\n    this.t = Math.min(MAX_P, Math.max(0, (this.t ?? 0) + dy));\n  }\n  renderVals() {\n    const p = (this.state && this.state.p != null) ? this.state.p : 0;\n    const rev = this.rev || {};\n    return {\n      accent: this.props.accent ?? '#B3202A',\n      bg: this.props.bg ?? '#F4F2ED',\n      contentH: CONTENT_H,\n      endTop: END_TOP,\n      scrollY: Math.round(-p * 10) / 10,\n      onWheel: (e) => this.move(e.deltaY * 0.9),\n      touchStart: (e) => { this.ty = e.touches[0].clientY; },\n      touchMove: (e) => {\n        const y = e.touches[0].clientY;\n        this.move(((this.ty ?? y) - y) * 1.4);\n        this.ty = y;\n      },\n      items: ITEMS.map((it, i) => ({\n        ...it,\n        op: rev[i] ? 1 : 0,\n        dy: rev[i] ? 0 : 60,\n        s: rev[i] ? 1 : 0.86\n      }))\n    };\n  }\n}\n", "props": {"accent": "#B3202A", "bg": "#F4F2ED"}, "w": 390, "tpl": "tpl-mobile"}};</script>
