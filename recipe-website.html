ate({ p: this.p, n: Object.keys(this.rev).length });\n      this.raf = requestAnimationFrame(tick);\n    };\n    this.raf = requestAnimationFrame(tick);\n  }\n  componentWillUnmount() {\n    cancelAnimationFrame(this.raf);\n  }\n  renderVals() {\n    const p = (this.state && this.state.p != null) ? this.state.p : 0;\n    const rev = this.rev || {};\n    return {\n      accent: this.props.accent ?? '#B3202A',\n      bg: this.props.bg ?? '#F4F2ED',\n      contentH: CONTENT_H,\n      endTop: END_TOP,\n      scrollY: Math.round(-p * 10) / 10,\n      hintOp: p > 40 ? 0 : 1,\n      onWheel: (e) => { this.t = Math.min(MAX_P, Math.max(0, (this.t ?? 0) + e.deltaY * 0.9)); },\n      items: ITEMS.map((it, i) => ({\n        ...it,\n        op: rev[i] ? 1 : 0,\n        dy: rev[i] ? 0 : 70,\n        s: rev[i] ? 1 : 0.86,\n        delay: '0s'\n      }))\n    };\n  }\n}\n", "props": {"accent": "#B3202A", "bg": "#F4F2ED"}, "w": 1440, "tpl": "tpl-desktop"}, "mobile": {"js": "\nconst H = window.__DC_H;\nconst LW = 342, LH = 206, PW = 163, PH = 331;\nconst L0 = 480, LP = LH + 24;\nconst P0 = L0 + 3 * LP + LH + 48, PP = PH + 24;\nconst ITEMS = [\n  { img: 'assets/89976c2996daa62cc572a2d1c3a91294.png', alt: 'Recipe Website on laptop \u2014 home screen', x: 24, top: L0, w: LW, h: LH, col: 0 },\n  { img: 'assets/5a0c1765b17846f7843d72c008a90d71.png', alt: 'Recipe Website on laptop \u2014 meal plan calendar', x: 24, top: L0 + LP, w: LW, h: LH, col: 0 },\n  { img: 'assets/983847044da9fc8e13161ada1b17c07b.png', alt: 'Recipe Website on laptop \u2014 recipes of the day', x: 24, top: L0 + 2 * LP, w: LW, h: LH, col: 0 },\n  { img: 'assets/a7c385e91e9ccbdbbcd913f04b7c78af.png', alt: 'Recipe Website on laptop \u2014 recipe detail', x: 24, top: L0 + 3 * LP, w: LW, h: LH, col: 0 },\n  { img: 'assets/80ceb6e10b70f29adabd5206c5d107c8.png', alt: 'Recipe Website on phone \u2014 meal plan calendar', x: 24, top: P0, w: PW, h: PH, col: 0 },\n  { img: 'assets/f9a7d3803e40b0eb82e2a28831132def.png', alt: 'Recipe Website on phone \u2014 home screen', x: 203, top: P0, w: PW, h: PH, col: 1 },\n  { img: 'assets/1710c2ffe1778aabc621b81a3dca5b74.png', alt: 'Recipe Website on phone \u2014 recipe detail', x: 24, top: P0 + PP, w: PW, h: PH, col: 0 },\n  { img: 'assets/867628bc6d88b39f88f7424e5463d1f4.png', alt: 'Recipe Website on phone \u2014 recipes of the day', x: 203, top: P0 + PP, w: PW, h: PH, col: 1 }\n];\nconst END_TOP = P0 + PP + PH + 80;\nconst CONTENT_H = END_TOP + 170;\nconst MAX_P = Math.max(0, CONTENT_H - H);\nclass Component extends DCLogic {\n  componentDidMount() {\n    this.p = 0;\n    this.t = 0;\n    this.rev = {};\n    const tick = () => {\n      const d = this.t - this.p;\n      let changed = false;\n      if (Math.abs(d) > 0.2) { this.p += d * 0.1; changed = true; }\n      ITEMS.forEach((it, i) => {\n        if (!this.rev[i] && this.p >= Math.max(50 + i * 110, it.top - (H - 90))) { this.rev[i] = true; changed = true; }\n      });\n      if (changed) this.setState({ p: this.p, n: Object.keys(this.rev).length });\n      this.raf = requestAnimationFrame(tick);\n    };\n    this.raf = requestAnimationFrame(tick);\n  }\n  componentWillUnmount() {\n    cancelAnimationFrame(this.raf);\n  }\n  move(dy) {\n    this.t = Math.min(MAX_P, Math.max(0, (this.t ?? 0) + dy));\n  }\n  renderVals() {\n    const p = (this.state && this.state.p != null) ? this.state.p : 0;\n    const rev = this.rev || {};\n    return {\n      accent: this.props.accent ?? '#B3202A',\n      bg: this.props.bg ?? '#F4F2ED',\n      contentH: CONTENT_H,\n      endTop: END_TOP,\n      scrollY: Math.round(-p * 10) / 10,\n      onWheel: (e) => this.move(e.deltaY * 0.9),\n      touchStart: (e) => { this.ty = e.touches[0].clientY; },\n      touchMove: (e) => {\n        const y = e.touches[0].clientY;\n        this.move(((this.ty ?? y) - y) * 1.4);\n        this.ty = y;\n      },\n      items: ITEMS.map((it, i) => ({\n        ...it,\n        op: rev[i] ? 1 : 0,\n        dy: rev[i] ? 0 : 60,\n        s: rev[
