<p style="margin: 0; font-size: 14px; line-height: 1.6">Furn is a modern Egyptian bakery inspired by the traditional furn, the neighborhood bread oven that’s part of everyday life in Egypt. I’m focusing on eish baladi and reimagining it in a contemporary way.</p>
