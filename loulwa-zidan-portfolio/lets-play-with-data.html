<p style="margin: 0; font-size: 14px; line-height: 1.6">I chose to visualize the screentime dataset as a growing digital ecosystem. Each app represents a living organism that grows as you spend more time on it. The more you use an app, the larger and more dominant it becomes.</p>
<p style="margin: 0; font-size: 14px; line-height: 1.6">Also, creating a captivating transition that relates to our addiction to our phones.</p>
</section>
