<p style="margin: 0; font-size: 14px; line-height: 1.6">A limited-edition line of refreshing drinks inspired by the spirit of Ramadan. Blending traditional flavors like tamarind, hibiscus, and qamar al-din with a modern twist, Sip Sip brings a nostalgic yet elevated experience to iftar tables. Sustainably packaged in cans, the design captures the essence of the holy month.</p>
<p style="margin: 0; font-size: 14px; line-height: 1.6">The idea came to life when I realized how quickly traditional Ramadan drinks spoil—and how much of them go to waste. Sip Sip offers a sustainable solution: individually portioned cans that preserve freshness and prevent waste.</p>

<script>window.__DC_PAGE = {"desktop": {"js": "\nconst H = window.__DC_H;\nconst CW = 416, CH = 234, GAP = 32;\nconst R0 = 500, RP = CH + 40;\nconst COLX = [64, 64 + CW + GAP, 64 + 2 * (CW + GAP)];\nconst SRC = [\n  ['3473173564541fc0c9151e0fac5ef7ad.jpg', 'SipSip hibiscus six-pack and can', 'cover'],\n  ['ce722814b71c6846101f679139be006c.jpg', 'SipSip sobia six-pack and can', 'cover'],\n  ['c0c9ad236790b02536f50ac109bbbbce.jpg', 'SipSip qamar al-din six-pack and can', 'cover'],\n  ['27de01556b639344cbc9e537918c29e4.png', 'SipSip qamar al-din can label, flat', 'contain'],\n  ['01db89d5e1f84a80d4a17b58fb770e7a.png', 'SipSip coconut can label, flat', 'contain'],\n  ['15b5c511771aa575ccecfb6d3d1d4e72.png', 'SipSip hibiscus can label, flat', 'contain'],\n  ['28e3f8faa98226ceeece07d2bb26fc15.jpg', 'SipSip yellow can', 'cover'],\n  ['c0d8e0614f25a0cc9a2c438870b3dcab.jpg', 'SipSip blue can', 'cover'],\n  ['c2aea8a38342f8faaa386af1ef6135e1.jpg', 'SipSip red can', 'cover']\n];\nconst ITEMS = SRC.map((s, i) => ({ img: s[0], alt: s[1], fit: s[2], x: COLX[i % 3], top: R0 + Math.floor(i / 3) * RP, w: CW, h: CH }));\nconst END_TOP = R0 + 2 * RP + CH + 120;\nconst CONTENT_H = END_TOP + 200;\nconst MAX_P = Math.max(0, CONTENT_H - H);\nclass Component extends DCLogic {\n  componentDidMount() {\n    this.p = 0;\n    this.t = 0;\n    this.rev = {};\n    const tick = () => {\n      const d = this.t - this.p;\n      let changed = false;\n      if (Math.abs(d) > 0.2) { this.p += d * 0.1; changed = true; }\n      ITEMS.forEach((it, i) => {\n        if (!this.rev[i] && this.p >= Math.max(50 + i * 70, it.top - (H - 120))) { this.rev[i] = true; changed = true; }\n      });\n      if (changed) this.setState({ p: this.p, n: Object.keys(this.rev).length });\n      this.raf = requestAnimationFrame(tick);\n    };\n    this.raf = requestAnimationFrame(tick);\n  }\n  componentWillUnmount() {\n    cancelAnimationFrame(this.raf);\n  }\n  renderVals() {\n    const p = (this.state && this.state.p != null) ? this.state.p : 0;\n    const rev = this.rev || {};\n    return {\n      accent: this.props.accent ?? '#B3202A',\n      bg: this.props.bg ?? '#F4F2ED',\n      contentH: CONTENT_H,\n      endTop: END_TOP,\n      scrollY: Math.round(-p * 10) / 10,\n      hintOp: p > 40 ? 0 : 1,\n      onWheel: (e) => { this.t = Math.min(MAX_P, Math.max(0, (this.t ?? 0) + e.deltaY * 0.9)); },\n      items: ITEMS.map((it, i) => ({\n        ...it,\n        op: rev[i] ? 1 : 0,\n        dy: rev[i] ? 0 : 70,\n        s: rev[i] ? 1 : 0.86\n      }))\n    };\n  }\n}\n", "props": {"accent": "#B3202A", "bg": "#F4F2ED"}, "w": 1440, "tpl": "tpl-desktop"}, "mobile": {"js": "\nconst H = window.__DC_H;\nconst CW = 342, CH = 192;\nconst R0 = 560, RP = CH + 20;\nconst SRC = [\n  ['3473173564541fc0c9151e0fac5ef7ad.jpg', 'SipSip hibiscus six-pack and can', 'cover'],\n  ['ce722814b71c6846101f679139be006c.jpg', 'SipSip sobia six-pack and can', 'cover'],\n  ['c0c9ad236790b02536f50ac109bbbbce.jpg', 'SipSip qamar al-din six-pack and can', 'cover'],\n  ['27de01556b639344cbc9e537918c29e4.png', 'SipSip qamar al-din can label, flat', 'contain'],\n  ['01db89d5e1f84a80d4a17b58fb770e7a.png', 'SipSip coconut can label, flat', 'contain'],\n  ['15b5c511771aa575ccecfb6d3d1d4e72.png', 'SipSip hibiscus can label, flat', 'contain'],\n  ['28e3f8faa98226ceeece07d2bb26fc15.jpg', 'SipSip yellow can', 'cover'],\n  ['c0d8e0614f25a0cc9a2c438870b3dcab.jpg', 'SipSip blue can', 'cover'],\n  ['c2aea8a38342f8faaa386af1ef6135e1.jpg', 'SipSip red can', 'cover']\n];\nconst ITEMS = SRC.map((s, i) => ({ img: s[0], alt: s[1], fit: s[2], x: 24, top: R0 + i * RP, w: CW, h: CH }));\nconst END_TOP = R0 + (SRC.length - 1) * RP + CH + 80;\nconst CONTENT_H = END_TOP + 170;\nconst MAX_P = Math.max(0, CONTENT_H - H);\nclass Component extends DCLogic {\n  componentDidMount() {\n    this.p = 0;\n    this.t = 0;\n    this.rev = {};\n    const tick = () => {\n      const d = this.t - this.p;\n      let changed = false;\n      if (Math.abs(d) > 0.2
