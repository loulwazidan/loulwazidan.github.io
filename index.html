<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Loulwa Zidan — motion graphic designer based in Cairo. Branding, editorial, packaging, UI and more.">

<style>

body{margin:0;background:#F4F2ED;font-family:'JetBrains Mono',monospace;color:#1E1C1A}
a{color:#1E1C1A}
.nav a .circ{opacity:0;transition:opacity .18s ease}
.nav a:hover,.nav a:focus-visible{color:var(--accent,#B3202A) !important}
.nav a:hover .circ,.nav a:focus-visible .circ{opacity:1}
.nav a:focus-visible{outline:none}
.cs:hover,.cs:focus-visible{color:var(--accent,#B3202A)}
.work:hover .wl,.work:focus-visible .wl{color:var(--accent,#B3202A)}
.work:focus-visible{outline:none}

html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none}
.dc-scale{position:absolute;left:0;top:0;transform-origin:0 0}
</style>
</head>
<body>
<div id="stage"></div>
<noscript><p style="padding:24px;font-family:monospace">This site needs JavaScript turned on.</p></noscript>

<a href="about.html" style="position: relative; display: flex; align-items: center; min-height: 44px; padding: 0 16px; text-decoration: none">about me<svg class="circ" viewBox="0 0 130 56" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: -4px; top: -2px; width: calc(100% + 8px); height: calc(100% + 4px); overflow: visible; pointer-events: none" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path vector-effect="non-scaling-stroke" d="M14 30 C8 10 60 3 104 8 C130 12 126 44 74 50 C34 54 4 42 10 24 C16 10 52 4 90 6"></path></svg></a>

<sc-for list="{{items}}" as="item" hint-placeholder-count="4">
<a href="{{item.href}}" class="work" aria-label="{{item.aria}}" style="position: absolute; top: 0; left: {{item.x}}px; display: block; width: {{item.w}}px; height: {{item.h}}px; transform: translate3d(0, {{item.y}}px, 0); will-change: transform; text-decoration: none; color: #1E1C1A">
<sc-if value="{{item.img}}" hint-placeholder-val="{{ true }}">
<img src="{{item.img}}" alt="{{item.alt}}" style="width: {{item.w}}px; height: {{item.h}}px; object-fit: contain; display: block">
</sc-if>
<sc-if value="{{item.vid}}" hint-placeholder-val="{{ false }}">
<video src="{{item.vid}}" aria-label="{{item.alt}}" autoPlay="{{ true }}" muted="{{ true }}" loop="{{ true }}" playsInline="{{ true }}" style="width: {{item.w}}px; height: {{item.h}}px; border-radius: 50%; object-fit: cover; display: block; background: #221D1C; transform: rotate({{item.rot}}deg); will-change: transform"></video>
</sc-if>
<sc-if value="{{item.noImg}}" hint-placeholder-val="{{ false }}">
<div style="width: {{item.w}}px; height: {{item.h}}px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 1.5px dashed #ADA698; background: rgba(30, 28, 26, 0.035); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #6B665E">[PNG — {{item.name}}]</div>

<span style="font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 19px; line-height: 1.2" class="wl">{{item.label}}</span>
<span style="font-size: 12.5px; line-height: 1.35; letter-spacing: 0.04em; text-transform: uppercase">{{item.fields}}</span>
</div>
</a>
</sc-for>

</div>
</template>

<header style="position: absolute; left: 0; top: 0; width: 390px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: flex-start; padding: 24px 20px 0 24px">
<a href="index.html" aria-label="Loulwa Zidan — home" style="display: block"><img src="assets/561ee1317bb91b83e725888ff944bc61.png" alt="Loulwa Zidan" style="width: 72px; height: auto; display: block"></a>

<div style="position: absolute; left: 24px; bottom: 28px; width: 250px; display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; line-height: 1.35; letter-spacing: 0.01em; text-transform: uppercase">

</div>
</template>
<script>window.__DC_PAGE = {"desktop": {"js": "\nconst WORKS = [\n  { name: 'Superlativa', href: 'superlativa.html', fields: 'Branding + packaging \u2014 2024', img: 'assets/dd0e598806e46c94ad1d1979493389bc.png', alt: 'Superlativa supplement label, front and back', x: 200, w: 560, h: 205, side: 'right' },\n  { name: 'Hidden Patterns', href: 'hidden-patterns.html', fields: 'Poster series + tickets \u2014 2025', img: 'assets/49af4b919ee5bcdd125248573717b77f.png', alt: \"Nature's Code event tickets\", x: 720, w: 520, h: 321, side: 'left' },\n  { name: 'Still Here', href: 'still-here.html', fields: 'Thesis \u2014 2026', img: 'assets/305035fb0965ba0064267f097656801c.png', alt: 'Still Here \u2014 How does absence stay present in your life? with four family photographs', x: 200, w: 560, h: 285, side: 'right' },\n  { name: 'Furn', href: 'furn.html', fields: 'Branding + merch \u2014 2026', img: 'assets/0f1972d00a0fabfdbc7532b7d7d737b5.png', alt: 'White t-shirt with red lettering and a bread-seller illustration', x: 780, w: 460, h: 402, side: 'left' },\n  { name: \"Let's Play With Data\", href: 'lets-play-with-data.html', fields: 'Data visualisation \u2014 2025', vid: 'assets/f35ec3b48f1591b2aed561956808d0c7.mp4', alt: 'Spinning network data visualisation', x: 380, w: 300, h: 300, side: 'right' }\n];\nconst H = window.__DC_H;\nconst GAP = 600;\nconst LOOP = WORKS.length * GAP;\nconst START = 700;\nfunction mod(a, n) { return ((a % n) + n) % n; }\nclass Component extends DCLogic {\n  componentDidMount() {\n    this.p = START;\n    this.t = START;\n    const tick = () => {\n      if (this.props.autoscroll) this.t += 0.9;\n      const d = this.t - this.p;\n      if (Math.abs(d) > 0.2) {\n        this.p += d * 0.1;\n        this.setState({ p: this.p });\n      }\n      this.raf = requestAnimationFrame(tick);\n    };\n    this.raf = requestAnimationFrame(tick);\n  }\n  componentWillUnmount() {\n    cancelAnimationFrame(this.raf);\n  }\n  renderVals() {\n    const p = (this.state && this.state.p != null) ? this.state.p : START;\n    return {\n      accent: this.props.accent ?? '#B3202A',\n      bg: this.props.bg ?? '#F4F2ED',\n      onWheel: (e) => { this.t = (this.t ?? START) + e.deltaY * 0.9; },\n      items: WORKS.map((w, i) => ({\n        ...w,\n        label: '{' + w.name + '}',\n        aria: 'Open ' + w.name,\n        noImg: !w.img && !w.vid,\n        rot: w.vid ? Math.round(p * 0.25 * 10) / 10 : 0,\n        y: Math.round((H - mod(p - i * GAP, LOOP)) * 10) / 10,\n        capX: w.side === 'right' ? w.w + 28 : -258,\n        capY: w.h - 66\n      }))\n    };\n  }\n}\n", "props": {"accent": "#B3202A", "bg": "#F4F2ED", "autoscroll": false}, "w": 1440, "tpl": "tpl-desktop"}, "mobile": {"js": "\nconst WORKS = [\n  { name: 'Superlativa', href: 'superlativa.html', fields: 'Branding + packaging \u2014 2024', img: 'assets/dd0e598806e46c94ad1d1979493389bc.png', alt: 'Superlativa supplement label, front and back', x: 20, w: 300, h: 110 },\n  { name: 'Hidden Patterns', href: 'hidden-patterns.html', fields: 'Poster series + tickets \u2014 2025', img: 'assets/49af4b919ee5bcdd125248573717b77f.png', alt: \"Nature's Code event tickets\", x: 106, w: 264, h: 163 },\n  { name: 'Still Here', href: 'still-here.html', fields: 'Thesis \u2014 2026', img: 'assets/305035fb0965ba0064267f097656801c.png', alt: 'Still Here \u2014 How does absence stay present in your life? with four family photographs', x: 24, w: 300, h: 153 },\n  { name: 'Furn', href: 'furn.html', fields: 'Branding + merch \u2014 2026', img: 'assets/0f1972d00a0fabfdbc7532b7d7d737b5.png', alt: 'White t-shirt with red lettering and a bread-seller illustration', x: 126, w: 240, h: 210 },\n  { name: \"Let's Play With Data\", href: 'lets-play-with-data.html', fields: 'Data visualisation \u2014 2025', vid: 'assets/f35ec3b48f1591b2aed561956808d0c7.mp4', alt: 'Spinning network data visualisation', x: 90, w: 170, h: 170 }\n];\nconst H = window.__DC_H;\nconst GAP = 440;\nconst LOOP = WORKS.length * GAP;\nconst START = 640;\nfunction mod(a, n) { return ((a % n) + n) % n; }\nclass Component extends DCLogic {\n  componentDidMount() {\n    this.p = START;\n    this.t = START;\n    const tick = () => {\n      if (this.props.autoscroll) this.t += 0.7;\n      const d = this.t - this.p;\n      if (Math.abs(d) > 0.2) {\n        this.p += d * 0.1;\n        this.setState({ p: this.p });\n      }\n      this.raf = requestAnimationFrame(tick);\n    };\n    this.raf = requestAnimationFrame(tick);\n  }\n  componentWillUnmount() {\n    cancelAnimationFrame(this.raf);\n  }\n  renderVals() {\n    const p = (this.state && this.state.p != null) ? this.state.p : START;\n    return {\n      accent: this.props.accent ?? '#B3202A',\n      bg: this.props.bg ?? '#F4F2ED',\n      onWheel: (e) => { this.t = (this.t ?? START) + e.deltaY * 0.9; },\n      touchStart: (e) => { this.ty = e.touches[0].clientY; },\n      touchMove: (e) => {\n        const y = e.touches[0].clientY;\n        this.t = (this.t ?? START) + ((this.ty ?? y) - y) * 1.4;\n        this.ty = y;\n      },\n      items: WORKS.map((w, i) => ({\n        ...w,\n        label: '{' + w.name + '}',\n        aria: 'Open ' + w.name,\n        noImg: !w.img && !w.vid,\n        rot: w.vid ? Math.round(p * 0.25 * 10) / 10 : 0,\n        y: Math.round((H - mod(p - i * GAP, LOOP)) * 10) / 10,\n        capY: w.h + 10\n      }))\n    };\n  }\n}\n", "props": {"accent": "#B3202A", "bg": "#F4F2ED", "autoscroll": false}, "w": 390, "tpl": "tpl-mobile"}};</script>
